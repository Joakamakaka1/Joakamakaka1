name: Metrics

# Generates metrics.languages.svg (most used languages) and commits it to the
# default branch. Replaces the public github-readme-stats instance, which went
# down (503 DEPLOYMENT_PAUSED).
#
# Needs the METRICS_TOKEN secret: a classic personal access token with no scopes
# (public repositories only).

permissions:
  contents: write

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - name: Generate languages card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Build the image from the pinned source instead of pulling the
          # mutable ghcr.io/lowlighter/metrics:v3.34 tag, which gets the tokens.
          use_prebuilt_image: no
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          config_timezone: Europe/Madrid
          committer_message: "chore: update languages card [skip ci]"
