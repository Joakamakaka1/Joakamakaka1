name: Metrics

# Generates metrics.languages.svg (most used languages) and commits it to the
# default branch. Replaces the public github-readme-stats instance, which went
# down (503 DEPLOYMENT_PAUSED).
#
# Needs the METRICS_TOKEN secret: a classic personal access token with no scopes
# (public repositories only).

permissions:
  contents: write

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      # The action would pull the mutable ghcr.io/lowlighter/metrics:v3.34 tag,
      # and that container receives the tokens. Building from source is not an
      # option either: the v3.34 Dockerfile no longer builds (nokogiri fails).
      # So pull the official v3.34 image by digest and tag it with the local
      # name the action looks for (metrics:<package.json version>); with
      # use_prebuilt_image: no the action then runs it instead of building.
      - name: Pull metrics image by digest
        run: |
          docker pull ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65
          docker tag ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65 metrics:3.34.0

      - name: Generate languages card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          config_timezone: Europe/Madrid
          committer_message: "chore: update languages card [skip ci]"
